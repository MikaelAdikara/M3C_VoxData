<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Knowledge cards · Learning Line</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<script>try{var t=localStorage.getItem("ll-theme");if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<script src="assets/theme.js"></script>
<link rel="stylesheet" href="assets/app.css">
<style>
  body { font-size: 15px; }
  .kb { display: grid; grid-template-columns: 360px minmax(0, 1fr) 400px; gap: var(--s5); align-items: start; }
  .filters { display: flex; flex-wrap: wrap; gap: var(--s2); margin-bottom: var(--s3); }
  .filters .choice { min-height: 40px; font-size: 14px; padding: 0 var(--s3); }
  .list { list-style: none; margin: 0; padding: 0; }
  .list button {
    width: 100%; display: grid; gap: 2px; text-align: left; padding: var(--s3); min-height: 64px;
    background: transparent; border: 0; border-bottom: 1px solid var(--line); font: inherit; color: inherit; cursor: pointer;
    transition: background-color var(--t-fast) ease;
  }
  .list button[aria-current="true"] { background: var(--panel); }
  @media (hover: hover) and (pointer: fine) { .list button:hover { background: var(--ground); } }
  .list__top { display: flex; justify-content: space-between; align-items: center; gap: var(--s2); }
  .list__sym { color: var(--ink-2); font-size: 14px; }
  .list li[data-status="retired"] .list__sym { text-decoration: line-through; color: var(--muted); }
  .card-fields { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: var(--s3) var(--s4); margin: 0; }
  .card-fields dt { color: var(--muted); }
  .card-fields dd { margin: 0; }
  .revs { list-style: none; margin: var(--s4) 0 0; padding: 0; font-size: 14px; }
  .revs li { display: flex; justify-content: space-between; gap: var(--s3); padding: var(--s2) 0; border-top: 1px solid var(--line); }
  .actions { display: flex; flex-wrap: wrap; gap: var(--s3); margin-top: var(--s5); }
  .ask { display: grid; gap: var(--s3); }
  .ask form { display: flex; gap: var(--s2); }
  .ask .input { flex: 1; }
  .suggest { display: flex; flex-wrap: wrap; gap: var(--s2); }
  .suggest button {
    text-align: left; padding: var(--s2) var(--s3); min-height: 44px; border-radius: var(--r-input);
    border: 1px solid var(--line); background: var(--ground); font: 400 14px var(--font); color: var(--ink-2); cursor: pointer;
    transition: border-color var(--t-fast) ease, transform var(--t-fast) var(--ease-out);
  }
  .suggest button:active { transform: scale(.98); }
  .answer { border-top: 1px solid var(--line); padding-top: var(--s4); display: grid; gap: var(--s3); }
  .answer__q { font-weight: 700; }
  .answer__mode { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--muted); }
  .cite {
    display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: var(--r-pill);
    background: var(--safe-tint); color: var(--safe-text); font-family: var(--font); font-size: 13px; font-weight: 700; white-space: nowrap;
    border: 0; cursor: pointer;
  }
  .empty-answer { display: grid; gap: var(--s3); padding: var(--s4); border: 1px dashed var(--line-strong); border-radius: var(--r-panel); }
  @media (max-width: 1279px) { .kb { grid-template-columns: 340px minmax(0, 1fr); } .assistant { grid-column: 1 / -1; } }
  @media (max-width: 767px) { .actions .btn { width: 100%; } }
  @media (max-width: 860px) { .kb { grid-template-columns: 1fr; } .card-fields { grid-template-columns: 1fr; gap: 2px; } .card-fields dd { margin-bottom: var(--s3); } }
</style>
</head>
<body data-screen="knowledge" data-role="senior-expert" data-trail="card">

<main class="page">
  <div class="page__head">
    <div>
      <h1 class="page__title">Knowledge cards</h1>
      <p class="page__sub">Sealer process · 12 cards · the assistant reads validated cards only</p>
    </div>
    <span class="loop loop--kaizen">Kaizen loop</span>
  </div>

  <div class="kb">
    <section class="panel" aria-labelledby="l-title">
      <div class="panel__head"><h2 id="l-title">Cards</h2><span class="muted" style="font-size:13px">Showing 5 of 12</span></div>
      <div class="panel__body" style="padding-top: var(--s3); padding-bottom: var(--s3)">
        <fieldset class="filters" style="border:0; padding:0; margin-bottom: var(--s3)">
          <legend class="sr-only">Status</legend>
          <label class="choice"><input type="radio" name="f" value="all" checked>All <span class="num muted">12</span></label>
          <label class="choice"><input type="radio" name="f" value="validated">Validated <span class="num muted">9</span></label>
          <label class="choice"><input type="radio" name="f" value="draft">Draft <span class="num muted">2</span></label>
          <label class="choice"><input type="radio" name="f" value="retired">Retired <span class="num muted">1</span></label>
        </fieldset>
        <ul class="list" id="list"></ul>
      </div>
    </section>

    <section aria-labelledby="c-title" id="cardview"></section>

    <section class="panel assistant" aria-labelledby="a-title">
      <div class="panel__head"><h2 id="a-title">Ask the assistant</h2><span class="badge badge--outline">Offline mode</span></div>
      <div class="panel__body ask">
        <form id="ask-form">
          <label for="q" class="sr-only">Question</label>
          <input class="input" id="q" placeholder="Describe the problem at the line" autocomplete="off">
          <button class="btn" aria-label="Ask"><i class="ph-bold ph-arrow-up" aria-hidden="true"></i></button>
        </form>
        <div class="suggest" id="suggest"></div>
        <div id="answer"></div>
        <p class="muted" style="font-size: 13px">Answers quote validated cards and cite them. Line-stop decisions stay with the team leader.</p>
      </div>
    </section>
  </div>
</main>

<script src="assets/bead.js"></script>
<script src="assets/shell.js"></script>
<script>
const CARDS = [
  { id: "KC-SEAL-021", rev: 3, status: "draft", station: "st-04", m: "Method", sym: "Bead break at seam-R-door-07", cause: "Nozzle angle drifts after nozzle change", cm: "Angle gauge check after every nozzle change; add to change checklist", std: "QC process chart, sealer section", from: "KT-0418",
    revs: [["r3", "Draft from KT-0418 · awaiting senior expert"], ["r2", "Validated · role:senior-expert@body"], ["r1", "Validated · role:senior-expert@body"]] },
  { id: "KC-SEAL-014", rev: 3, status: "validated", station: "st-04", m: "Machine", sym: "Thin bead on door seams at shift start", cause: "Sealer viscosity high when material is cold after the overnight stop", cm: "Warm-up purge of 30 s before the first body; check gun pressure at start-up", std: "Standardized work st-04, step 2",
    revs: [["r3", "Validated · role:senior-expert@body"], ["r2", "Validated"], ["r1", "Validated"]] },
  { id: "KC-SEAL-009", rev: 1, status: "validated", station: "st-02", m: "Material", sym: "False alarms on new grey sealer", cause: "Lower contrast under current lighting", cm: "Add polarising filter; re-validate model as a 4M change", std: "Inspection standard, camera set-up",
    revs: [["r1", "Validated · role:senior-expert@body"]] },
  { id: "KC-SEAL-030", rev: 1, status: "draft", station: "st-04", m: "Man", sym: "Offset bead after operator rotation", cause: "Hand-over misses robot path check", cm: "Pending senior validation", std: "Not yet",
    revs: [["r1", "Draft · awaiting senior expert"]] },
  { id: "KC-SEAL-004", rev: 4, status: "retired", station: "st-04", m: "Machine", sym: "Excess sealer", cause: "Old pump regulator (replaced)", cm: "Superseded by KC-SEAL-014", std: "Not applicable",
    revs: [["r4", "Retired · superseded by KC-SEAL-014"]] },
];
const BADGE = {
  validated: '<span class="badge badge--safe"><i class="ph-bold ph-seal-check" aria-hidden="true"></i>Validated</span>',
  draft: '<span class="badge badge--outline">Draft</span>',
  retired: '<span class="badge">Retired</span>',
};
let current = CARDS.some((c) => "#" + c.id === location.hash) ? location.hash.slice(1) : "KC-SEAL-021";
let filter = "all";

function renderList() {
  document.getElementById("list").innerHTML = CARDS.filter((c) => filter === "all" || c.status === filter).map((c) => `
    <li data-status="${c.status}"><button data-id="${c.id}" aria-current="${c.id === current}">
      <span class="list__top"><span class="mono">${c.id} r${c.rev}</span>${BADGE[c.status]}</span>
      <span class="list__sym">${c.sym} · ${c.station}</span>
    </button></li>`).join("") || `<li class="muted" style="padding: var(--s4) 0">No cards with this status.</li>`;
}

function renderCard() {
  const c = CARDS.find((x) => x.id === current);
  const tone = c.status === "validated" ? "safe" : c.status === "retired" ? "neutral" : "instruct";
  const icon = c.status === "validated" ? "ph-seal-check" : c.status === "retired" ? "ph-archive" : "ph-note-pencil";
  const title = c.status === "validated" ? "Validated: safe to reuse" : c.status === "retired" ? "Retired card" : "Draft: awaiting validation";
  const canValidate = c.status === "draft" && c.id === "KC-SEAL-021";
  document.getElementById("cardview").innerHTML = `
    <article class="plate swap" data-tone="${tone}">
      <div class="plate__band">
        <span class="plate__icon"><i class="ph-fill ${icon}" aria-hidden="true"></i></span>
        <h2 class="plate__title" id="c-title">${title}<small><span class="mono">${c.id} r${c.rev}</span> · ${c.station} · 4M: ${c.m}</small></h2>
      </div>
      <div class="plate__body">
        <dl class="card-fields">
          <dt>Symptom</dt><dd>${c.sym}</dd>
          <dt>Root cause</dt><dd>${c.cause}</dd>
          <dt>Countermeasure</dt><dd>${c.cm}</dd>
          <dt>Standard revised</dt><dd>${c.std}</dd>
          ${c.from ? `<dt>Source</dt><dd>Kaizen ticket <span class="mono">${c.from}</span> · trial passed, validation requested</dd>` : ""}
        </dl>
        <ul class="revs">${c.revs.map(([r, t]) => `<li><span class="mono">${r}</span><span class="muted">${t}</span></li>`).join("")}</ul>
        ${canValidate ? `<div class="actions">
          <button class="btn btn--xl" id="validate"><i class="ph-bold ph-seal-check" aria-hidden="true"></i>Validate card</button>
          <button class="btn btn--xl btn--ghost" id="return"><i class="ph-bold ph-arrow-u-up-left" aria-hidden="true"></i>Return with comment</button>
        </div>` : ""}
      </div>
    </article>`;
  if (canValidate) {
    document.getElementById("validate").addEventListener("click", () => {
      c.status = "validated";
      c.revs[0] = ["r3", "Validated · role:senior-expert@body · today"];
      renderList(); renderCard();
      LL.setTrail("done");
      LL.toast("KC-SEAL-021 r3 validated. Standard revised; yokoten to same-process stations.");
    });
    document.getElementById("return").addEventListener("click", () => LL.toast("Returned to the engineer with your comment."));
  }
}

const QUESTIONS = [
  "Thin bead at the start of shift on st-04, what do we do?",
  "Bead break near the right door after a nozzle change?",
  "Why are we getting false alarms on the grey sealer?",
  "How do we fix paint orange peel?",
];
function answerFor(q) {
  const s = q.toLowerCase();
  const card = (id) => CARDS.find((c) => c.id === id);
  const cite = (c) => `<button class="cite" data-id="${c.id}">${c.id} r${c.rev}</button>`;
  if (s.includes("thin")) { const c = card("KC-SEAL-014"); return `Run a warm-up purge of 30 s before the first body and check gun pressure at start-up ${cite(c)}. This is standardized work st-04, step 2.`; }
  if (s.includes("break") || s.includes("nozzle")) {
    const c = card("KC-SEAL-021");
    const r = c.status === "validated" ? c : { ...c, rev: 2 };
    return `Check the nozzle angle with the angle gauge after every nozzle change; it is on the change checklist ${cite(r)}.${c.status !== "validated" ? " Revision 3 is still a draft, so it is not used." : ""}`;
  }
  if (s.includes("false") || s.includes("grey")) { const c = card("KC-SEAL-009"); return `The grey sealer has lower contrast under current lighting. Add a polarising filter and re-validate the model as a 4M change ${cite(c)}.`; }
  return null;
}
function ask(q) {
  const a = answerFor(q);
  const box = document.getElementById("answer");
  box.innerHTML = `<div class="answer swap"><p class="answer__q">${q.replace(/</g, "&lt;")}</p>
    ${a ? `<p>${a}</p><div class="answer__mode"><span>Offline mode: quoted from the cited card</span></div>`
        : `<div class="empty-answer"><p><strong>No validated card covers this.</strong> The assistant does not guess.</p>
           <button class="btn btn--ghost" id="route"><i class="ph-bold ph-arrow-bend-up-right" aria-hidden="true"></i>Route to owner engineer</button></div>`}
  </div>`;
  box.querySelectorAll(".cite").forEach((b) => b.addEventListener("click", () => { current = b.dataset.id; renderList(); renderCard(); }));
  const r = document.getElementById("route");
  if (r) r.addEventListener("click", () => LL.toast("Question routed to the owner engineer."));
}

document.addEventListener("shell:ready", () => {
  renderList(); renderCard();
  document.getElementById("list").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-id]"); if (!b) return;
    current = b.dataset.id; renderList(); renderCard();
  });
  document.querySelector(".filters").addEventListener("change", (e) => { filter = e.target.value; renderList(); });
  document.getElementById("suggest").innerHTML = QUESTIONS.map((q) => `<button type="button">${q}</button>`).join("");
  document.getElementById("suggest").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    document.getElementById("q").value = b.textContent; ask(b.textContent);
  });
  document.getElementById("ask-form").addEventListener("submit", (e) => {
    e.preventDefault(); const q = document.getElementById("q").value.trim(); if (q) ask(q);
  });
});
</script>
</body>
</html>
