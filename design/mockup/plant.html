<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>See it on the floor · Learning Line</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem("ll-theme");if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="stylesheet" href="assets/app.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
} }
</script>
<style>
  /* mockup frame around the section */
  .mock-pad { min-height: 70vh; display: grid; place-items: center; text-align: center; padding: 64px 16px; }
  .mock-pad h1 { font: 800 clamp(44px, 8vw, 96px)/.92 "Big Shoulders Display", sans-serif; text-transform: uppercase; margin: 0; }
  .mock-pad p { max-width: 560px; margin: 16px auto 0; color: var(--muted, #6e6e6e); font-size: 18px; }

  /* ---------- See it on the floor (scroll-scrubbed 3D story) ---------- */
  .floor { position: relative; height: calc(var(--n, 6) * 110vh); }
  .floor__sticky { position: sticky; top: 0; height: 100vh; height: 100svh; overflow: hidden; background: #e4e4e4; }
  .floor__canvas, .floor__fallback { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .floor__fallback { opacity: 0; transition: opacity .3s ease; }
  .floor[data-fallback="true"] .floor__fallback { opacity: 1; }
  .floor[data-fallback="true"] .floor__canvas { display: none; }
  .floor__veil { position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(90deg, rgba(228,228,228,.92) 0%, rgba(228,228,228,.6) 30%, rgba(228,228,228,0) 52%); }
  .floor__head { position: absolute; left: clamp(16px, 5vw, 72px); top: clamp(72px, 12vh, 120px); }
  .floor__eyebrow { font: 700 13px/1 var(--font); letter-spacing: .14em; text-transform: uppercase; color: #5f5f5f; }
  .floor__h { margin: 10px 0 0; font: 800 clamp(34px, 4.6vw, 64px)/.92 "Big Shoulders Display", sans-serif; text-transform: uppercase; color: var(--ink, #252525); }
  .floor__card { position: absolute; left: clamp(16px, 5vw, 72px); bottom: clamp(24px, 9vh, 96px); width: min(460px, calc(100vw - 32px));
    padding: 24px 28px 26px; border-radius: 6px; color: #252525; background: #f1f1ef; border: 0; box-shadow: 0 22px 44px -30px rgba(38, 40, 43, .38); }
    .floor__kicker { font: 700 13px/1.2 var(--font); letter-spacing: .1em; text-transform: uppercase; color: var(--tone-ink, #5f5f5f); }
  .floor__title { margin: 6px 0 0; font: 800 clamp(28px, 3vw, 40px)/.95 "Big Shoulders Display", sans-serif; text-transform: uppercase; }
  .floor__body { margin: 10px 0 0; font: 400 17px/1.45 var(--font); color: #333; }
  .floor__text { transition: opacity .22s cubic-bezier(.23,1,.32,1), transform .22s cubic-bezier(.23,1,.32,1); }
  .floor__text[data-swap="true"] { opacity: 0; transform: translateY(6px); }
  .floor__dots { position: absolute; right: clamp(16px, 3vw, 40px); top: 50%; transform: translateY(-50%); display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
  .floor__dots li { width: 10px; height: 10px; border-radius: 50%; background: rgba(37,37,37,.22); transition: transform .2s ease, background .2s ease; }
  .floor__dots li[aria-current="step"] { background: var(--ink, #252525); transform: scale(1.35); }
  .floor__tag { position: absolute; right: clamp(16px, 3vw, 40px); bottom: 16px; color: #5f5f5f; font-weight: 600; font-size: 13px; line-height: 1; letter-spacing: .02em; }
  @media (max-width: 720px) {
    .floor__veil { background: linear-gradient(0deg, rgba(228,228,228,.95) 0%, rgba(228,228,228,.55) 38%, rgba(228,228,228,0) 60%); }
    .floor__dots { display: none; }
    .floor__body { font-size: 16px; }
  }
</style>
</head>
<body>
  <div class="mock-pad"><div><h1>One defect.<br>Five pairs of hands.</h1><p>(Mockup: landing sections above.) Scroll down: the new section plays the implementation on the floor.</p></div></div>

  <section class="floor" id="floor" aria-labelledby="floor-title" style="--n: 6">
    <div class="floor__sticky">
      <canvas class="floor__canvas" width="1920" height="1080" aria-hidden="true"></canvas>
      <img class="floor__fallback" src="assets/img/plant/style-1-aerial.jpg" alt="White clay model of the Karawang plant with the three loops drawn as routes">
      <div class="floor__veil"></div>
      <div class="floor__head">
        <div class="floor__eyebrow">How it works in the plant</div>
        <h2 class="floor__h" id="floor-title">See it on the floor</h2>
      </div>
      <div class="floor__card" aria-live="polite">
        <div class="floor__text">
          <div class="floor__kicker"></div>
          <h3 class="floor__title"></h3>
          <p class="floor__body"></p>
        </div>
      </div>
      <ol class="floor__dots" aria-label="Chapters"></ol>
      <span class="floor__tag">Concept animation, simulated data</span>
    </div>
  </section>

  <div class="mock-pad"><div><h1>Three things it never does</h1><p>(Mockup: landing continues.)</p></div></div>

<script type="module">
import { createPlant } from "./assets/plant3d.js";
import { CHAPTERS, storyState } from "./assets/plantStory.js";

const root = document.getElementById("floor");
const canvas = root.querySelector(".floor__canvas");
const fallback = root.querySelector(".floor__fallback");
const text = root.querySelector(".floor__text");
const kicker = root.querySelector(".floor__kicker"), title = root.querySelector(".floor__title"), body = root.querySelector(".floor__body");
const dots = root.querySelector(".floor__dots");
const TONES = { caution: "#6b4f00", safe: "#1a7a3d", instruct: "#0066b1" };
const STILLS = ["style-1-aerial", "style-1-aerial", "style-2-sealer", "style-2-sealer", "style-1-aerial", "style-3-rollout"];
CHAPTERS.forEach(() => dots.appendChild(document.createElement("li")));
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

let shown = -1;
function showChapter(c) {
  if (c === shown) return;
  const first = shown < 0; shown = c;
  const ch = CHAPTERS[c];
  const apply = () => {
    kicker.textContent = ch.kicker; title.textContent = ch.title; body.textContent = ch.body;
    root.style.setProperty("--tone-ink", TONES[ch.tone] || "#5f5f5f");
    text.dataset.swap = "false";
  };
  [...dots.children].forEach((d, i) => { if (i === c) d.setAttribute("aria-current", "step"); else d.removeAttribute("aria-current"); });
  fallback.src = `assets/img/plant/${STILLS[c]}.jpg`;
  if (first || reduce) apply(); else { text.dataset.swap = "true"; setTimeout(apply, 140); }
}

const progress = () => {
  const r = root.getBoundingClientRect();
  const span = root.offsetHeight - innerHeight;
  return span > 0 ? Math.min(1, Math.max(0, -r.top / span)) : 0;
};
showChapter(0);

let plant = null;
try {
  const small = innerWidth < 720;
  plant = await createPlant(canvas, { width: small ? 1280 : 1920, height: small ? 720 : 1080, modelBase: "assets/models", ao: !small, pixelRatio: 1 });
} catch (e) {
  console.warn("3D unavailable, showing stills", e);
  root.dataset.fallback = "true";
}

if (plant) {
  let visible = false, p = progress(), raf = 0;
  const io = new IntersectionObserver(([en]) => { visible = en.isIntersecting; if (visible && !raf) raf = requestAnimationFrame(loop); }, { rootMargin: "100px" });
  io.observe(root);
  function loop(now) {
    raf = 0;
    if (!visible) return;
    const target = progress();
    p += (target - p) * (reduce ? 1 : 0.12);           // eased scrub, so wheel steps glide
    const t = reduce ? 0 : now / 1000;
    const { state, chapter } = storyState(p, t, plant);
    plant.render(state);
    showChapter(chapter);
    raf = requestAnimationFrame(loop);
  }
  raf = requestAnimationFrame(loop);
} else {
  addEventListener("scroll", () => showChapter(Math.min(CHAPTERS.length - 1, Math.floor(progress() * CHAPTERS.length))), { passive: true });
}
</script>
</body>
</html>
